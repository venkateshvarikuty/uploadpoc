# AEM as a Cloud Service — API Configuration
# Allowlists IMS Client IDs for server-to-server access to AEM Author APIs
# (including /adobe/repository/;api=operations).
#
# IMPORTANT: This file MUST be deployed via a Cloud Manager Configuration Pipeline
# (Pipeline Type: Targeted Deployment → Config), NOT via a full-stack code pipeline.
#
# For RDE:
#   aio aem:rde:install -t env-config ./config/api.yaml
#
# To find your IMS Client ID:
#   AEM Developer Console → your environment → Service Credentials → clientId
#
# Each environment has its own service credential with a unique Client ID.

kind: "API"
version: "1.0"
metadata:
  envTypes: ["dev", "stage", "prod"]
data:
  allowedClientIDs:
    author:
      - "cm-p121280-e2245930-integration-0"
      - "cm-p121280-e1433051-integration-0"
      - "cm-p121280-e2245930-integration-1"

